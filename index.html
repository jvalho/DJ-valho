<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DECK — Spotify DJ</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --panel: #111111;
    --border: #222222;
    --accent: #1DB954;
    --accent2: #ff3b3b;
    --text: #f0f0f0;
    --muted: #555;
    --knob: #1a1a1a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Grain overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 9999;
    opacity: 0.4;
  }

  /* AUTH SCREEN */
  #auth-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    gap: 32px;
    padding: 40px;
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 72px;
    letter-spacing: 8px;
    color: var(--text);
    line-height: 1;
  }

  .logo span { color: var(--accent); }

  .auth-sub {
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  .auth-btn {
    background: var(--accent);
    color: #000;
    border: none;
    padding: 16px 48px;
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
    clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
  }

  .auth-btn:hover {
    background: #1ed760;
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(29,185,84,0.3);
  }

  /* MAIN APP */
  #app { display: none; flex-direction: column; min-height: 100vh; }

  /* TOP BAR */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }

  .topbar-logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 5px;
  }

  .topbar-logo span { color: var(--accent); }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .user-name {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 1px;
  }

  .logout-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 12px;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .logout-btn:hover { border-color: var(--accent2); color: var(--accent2); }

  /* NOW PLAYING */
  .now-playing {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 20px 24px;
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .album-art {
    width: 64px;
    height: 64px;
    background: var(--border);
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
  }

  .album-art img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .album-art-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    color: var(--muted);
  }

  /* Spinning vinyl effect */
  .vinyl-ring {
    position: absolute;
    inset: 0;
    border-radius: 0;
    border: 2px solid rgba(29,185,84,0.15);
    animation: none;
  }

  .vinyl-ring.spinning { animation: spin 3s linear infinite; }

  @keyframes spin { to { transform: rotate(360deg); } }

  .track-info { flex: 1; min-width: 0; }

  .track-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    letter-spacing: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .track-artist {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 1px;
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .track-duration {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 2px;
    margin-top: 4px;
  }

  /* PROGRESS BAR */
  .progress-section {
    padding: 0 24px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }

  .progress-bar-wrap {
    position: relative;
    height: 4px;
    background: var(--border);
    cursor: pointer;
    margin-bottom: 6px;
  }

  .progress-bar-fill {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.5s linear;
    position: relative;
  }

  .progress-bar-fill::after {
    content: '';
    position: absolute;
    right: -4px;
    top: -4px;
    width: 12px;
    height: 12px;
    background: var(--accent);
    border-radius: 50%;
    opacity: 0;
    transition: opacity 0.2s;
  }

  .progress-bar-wrap:hover .progress-bar-fill::after { opacity: 1; }

  .progress-times {
    display: flex;
    justify-content: space-between;
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 1px;
  }

  /* CONTROLS */
  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 16px 24px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }

  .ctrl-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text);
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.15s;
    font-size: 16px;
    clip-path: polygon(4px 0%, 100% 0%, calc(100% - 4px) 100%, 0% 100%);
  }

  .ctrl-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(29,185,84,0.05); }
  .ctrl-btn:active { transform: scale(0.95); }

  .ctrl-btn.play-btn {
    width: 56px;
    height: 56px;
    border-color: var(--accent);
    background: rgba(29,185,84,0.1);
    font-size: 20px;
  }

  .ctrl-btn.play-btn:hover { background: rgba(29,185,84,0.2); }

  .ctrl-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(29,185,84,0.1); }

  /* VOLUME & BPM ROW */
  .fx-row {
    display: flex;
    align-items: center;
    gap: 0;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }

  .fx-block {
    flex: 1;
    padding: 12px 16px;
    border-right: 1px solid var(--border);
  }

  .fx-block:last-child { border-right: none; }

  .fx-label {
    font-size: 8px;
    letter-spacing: 3px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .fx-value {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 2px;
    color: var(--accent);
  }

  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 3px;
    background: var(--border);
    outline: none;
    margin-top: 6px;
  }

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    background: var(--accent);
    cursor: pointer;
    clip-path: polygon(2px 0%, 100% 0%, calc(100% - 2px) 100%, 0% 100%);
  }

  /* EQ SECTION */
  .eq-section {
    display: flex;
    gap: 0;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }

  .eq-band {
    flex: 1;
    padding: 12px 8px;
    border-right: 1px solid var(--border);
    text-align: center;
  }

  .eq-band:last-child { border-right: none; }

  .eq-band-label {
    font-size: 8px;
    letter-spacing: 2px;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .eq-fader-wrap {
    display: flex;
    justify-content: center;
    height: 80px;
    align-items: flex-end;
  }

  .eq-fader {
    -webkit-appearance: none;
    writing-mode: vertical-lr;
    direction: rtl;
    width: 3px;
    height: 80px;
    background: var(--border);
    outline: none;
  }

  .eq-fader::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 20px;
    height: 8px;
    background: var(--text);
    cursor: pointer;
  }

  .eq-val {
    font-size: 9px;
    color: var(--muted);
    margin-top: 6px;
    letter-spacing: 1px;
  }

  /* VU METER */
  .vu-section {
    display: flex;
    gap: 4px;
    padding: 12px 24px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    align-items: flex-end;
    height: 60px;
  }

  .vu-bar {
    flex: 1;
    background: var(--border);
    position: relative;
    height: 36px;
    overflow: hidden;
  }

  .vu-fill {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--accent);
    transition: height 0.1s;
    height: 0%;
  }

  .vu-fill.hot { background: var(--accent2); }

  /* PLAYLIST */
  .playlist-section {
    flex: 1;
    overflow-y: auto;
    background: var(--bg);
  }

  .playlist-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px 8px;
    position: sticky;
    top: 0;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    z-index: 10;
  }

  .playlist-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    letter-spacing: 4px;
    color: var(--muted);
  }

  .playlist-select {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    padding: 6px 10px;
    letter-spacing: 1px;
    outline: none;
    cursor: pointer;
    max-width: 180px;
  }

  .track-row {
    display: flex;
    align-items: center;
    padding: 10px 24px;
    border-bottom: 1px solid rgba(34,34,34,0.5);
    cursor: pointer;
    transition: background 0.15s;
    gap: 12px;
  }

  .track-row:hover { background: rgba(29,185,84,0.04); }
  .track-row.active { background: rgba(29,185,84,0.08); border-left: 2px solid var(--accent); }

  .track-num {
    font-size: 10px;
    color: var(--muted);
    width: 20px;
    text-align: right;
    flex-shrink: 0;
  }

  .track-row.active .track-num { color: var(--accent); }

  .track-thumb {
    width: 36px;
    height: 36px;
    background: var(--border);
    flex-shrink: 0;
    overflow: hidden;
  }

  .track-thumb img { width: 100%; height: 100%; object-fit: cover; }

  .track-row-info { flex: 1; min-width: 0; }

  .track-row-name {
    font-size: 12px;
    letter-spacing: 0.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .track-row.active .track-row-name { color: var(--accent); }

  .track-row-artist {
    font-size: 10px;
    color: var(--muted);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .track-row-dur {
    font-size: 10px;
    color: var(--muted);
    flex-shrink: 0;
  }

  /* WAVEFORM VISUALIZER */
  .waveform-section {
    padding: 0 24px 0;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }

  canvas#waveform {
    width: 100%;
    height: 48px;
    display: block;
  }

  /* CROSSFADER */
  .crossfader-section {
    padding: 12px 24px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }

  .crossfader-label {
    font-size: 8px;
    letter-spacing: 3px;
    color: var(--muted);
    text-align: center;
    margin-bottom: 6px;
    text-transform: uppercase;
  }

  .crossfader-wrap {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .cf-side {
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--muted);
    width: 28px;
    text-align: center;
  }

  #crossfader {
    flex: 1;
    height: 3px;
    background: linear-gradient(to right, var(--accent), var(--border), var(--accent2));
  }

  #crossfader::-webkit-slider-thumb {
    background: var(--text);
    width: 18px;
    height: 18px;
    clip-path: polygon(3px 0%, 100% 0%, calc(100% - 3px) 100%, 0% 100%);
  }

  /* STATUS LED */
  .status-led {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--muted);
    display: inline-block;
    margin-right: 6px;
  }

  .status-led.on {
    background: var(--accent);
    box-shadow: 0 0 6px var(--accent);
    animation: pulse-led 2s ease-in-out infinite;
  }

  @keyframes pulse-led {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); }

  /* Loading */
  .loading { color: var(--muted); font-size: 11px; letter-spacing: 2px; padding: 24px; text-align: center; }

  .error-msg { color: var(--accent2); font-size: 11px; letter-spacing: 1px; padding: 16px 24px; }
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div id="auth-screen">
  <div class="logo">DECK<span>.</span></div>
  <div class="auth-sub">Spotify DJ Controller</div>
  <button class="auth-btn" onclick="authenticate()">Connect Spotify</button>
</div>

<!-- MAIN APP -->
<div id="app">

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="topbar-logo">DECK<span>.</span></div>
    <div class="topbar-right">
      <span class="user-name" id="user-name">—</span>
      <button class="logout-btn" onclick="logout()">LOGOUT</button>
    </div>
  </div>

  <!-- NOW PLAYING -->
  <div class="now-playing">
    <div class="album-art">
      <div class="album-art-placeholder" id="art-placeholder">♪</div>
      <img id="album-img" src="" style="display:none" alt="Album Art">
      <div class="vinyl-ring" id="vinyl-ring"></div>
    </div>
    <div class="track-info">
      <div class="track-name" id="track-name">NO TRACK LOADED</div>
      <div class="track-artist" id="track-artist">—</div>
      <div class="track-duration"><span id="pos-time">0:00</span> / <span id="dur-time">0:00</span></div>
    </div>
    <div style="text-align:right; flex-shrink:0;">
      <div style="font-size:9px; color:var(--muted); letter-spacing:2px; margin-bottom:4px;">STATUS</div>
      <div><span class="status-led" id="status-led"></span><span style="font-size:9px; letter-spacing:2px;" id="status-text">IDLE</span></div>
    </div>
  </div>

  <!-- PROGRESS -->
  <div class="progress-section">
    <div class="progress-bar-wrap" id="progress-wrap" onclick="seekTrack(event)">
      <div class="progress-bar-fill" id="progress-fill"></div>
    </div>
    <div class="progress-times">
      <span id="prog-left">0:00</span>
      <span id="prog-right">0:00</span>
    </div>
  </div>

  <!-- WAVEFORM -->
  <div class="waveform-section">
    <canvas id="waveform" width="800" height="48"></canvas>
  </div>

  <!-- CONTROLS -->
  <div class="controls">
    <button class="ctrl-btn" id="shuffle-btn" onclick="toggleShuffle()" title="Shuffle">⇄</button>
    <button class="ctrl-btn" onclick="prevTrack()" title="Previous">⏮</button>
    <button class="ctrl-btn play-btn" id="play-btn" onclick="togglePlay()" title="Play/Pause">▶</button>
    <button class="ctrl-btn" onclick="nextTrack()" title="Next">⏭</button>
    <button class="ctrl-btn" id="repeat-btn" onclick="toggleRepeat()" title="Repeat">↺</button>
  </div>

  <!-- CROSSFADER -->
  <div class="crossfader-section">
    <div class="crossfader-label">Crossfader</div>
    <div class="crossfader-wrap">
      <div class="cf-side">A</div>
      <input type="range" id="crossfader" min="0" max="100" value="50" oninput="crossfade(this.value)">
      <div class="cf-side">B</div>
    </div>
  </div>

  <!-- VOLUME & BPM -->
  <div class="fx-row">
    <div class="fx-block">
      <div class="fx-label">Volume</div>
      <div class="fx-value" id="vol-val">80%</div>
      <input type="range" id="vol-slider" min="0" max="100" value="80" oninput="setVolume(this.value)">
    </div>
    <div class="fx-block">
      <div class="fx-label">Tempo</div>
      <div class="fx-value" id="tempo-val">1.0×</div>
      <input type="range" id="tempo-slider" min="70" max="130" value="100" oninput="setTempo(this.value)">
    </div>
    <div class="fx-block">
      <div class="fx-label">Playback</div>
      <div class="fx-value" id="device-val" style="font-size:13px; letter-spacing:1px; color: var(--muted)">—</div>
    </div>
  </div>

  <!-- EQ -->
  <div class="eq-section">
    <div class="eq-band">
      <div class="eq-band-label">LOW</div>
      <div class="eq-fader-wrap">
        <input type="range" class="eq-fader" min="0" max="100" value="50" oninput="updateEQ('low', this.value)">
      </div>
      <div class="eq-val" id="eq-low">0 dB</div>
    </div>
    <div class="eq-band">
      <div class="eq-band-label">MID</div>
      <div class="eq-fader-wrap">
        <input type="range" class="eq-fader" min="0" max="100" value="50" oninput="updateEQ('mid', this.value)">
      </div>
      <div class="eq-val" id="eq-mid">0 dB</div>
    </div>
    <div class="eq-band">
      <div class="eq-band-label">HIGH</div>
      <div class="eq-fader-wrap">
        <input type="range" class="eq-fader" min="0" max="100" value="50" oninput="updateEQ('high', this.value)">
      </div>
      <div class="eq-val" id="eq-high">0 dB</div>
    </div>
    <div class="eq-band">
      <div class="eq-band-label">GAIN</div>
      <div class="eq-fader-wrap">
        <input type="range" class="eq-fader" min="0" max="100" value="50" oninput="updateEQ('gain', this.value)">
      </div>
      <div class="eq-val" id="eq-gain">0 dB</div>
    </div>
  </div>

  <!-- VU METER -->
  <div class="vu-section" id="vu-meter"></div>

  <!-- PLAYLIST -->
  <div class="playlist-section">
    <div class="playlist-header">
      <div class="playlist-title">QUEUE</div>
      <select class="playlist-select" id="playlist-select" onchange="loadPlaylist(this.value)">
        <option value="">— SELECT PLAYLIST —</option>
      </select>
    </div>
    <div id="track-list"><div class="loading">CONNECT TO LOAD TRACKS</div></div>
  </div>

</div>

<script>
const CLIENT_ID = '7eaade44e59e47d08ce8a778e7960ae7';
const REDIRECT_URI = 'https://claude.ai/';
const SCOPES = [
  'user-read-playback-state',
  'user-modify-playback-state',
  'user-read-currently-playing',
  'streaming',
  'user-read-email',
  'user-read-private',
  'playlist-read-private',
  'playlist-read-collaborative',
  'user-library-read'
].join(' ');

let token = null;
let player = null;
let deviceId = null;
let currentTrack = null;
let currentPlaylist = [];
let isPlaying = false;
let progressInterval = null;
let vuInterval = null;
let waveInterval = null;
let currentPosition = 0;
let currentDuration = 0;
let shuffleOn = false;
let repeatMode = 'off'; // off, track, context
let vuBars = [];

// ---- AUTH ----
function authenticate() {
  const state = Math.random().toString(36).substring(2);
  localStorage.setItem('spotify_auth_state', state);
  const params = new URLSearchParams({
    response_type: 'token',
    client_id: CLIENT_ID,
    scope: SCOPES,
    redirect_uri: REDIRECT_URI,
    state: state,
    show_dialog: 'false'
  });
  window.location.href = `https://accounts.spotify.com/authorize?${params}`;
}

function getTokenFromHash() {
  const hash = window.location.hash.substring(1);
  const params = new URLSearchParams(hash);
  if (params.get('access_token')) {
    token = params.get('access_token');
    localStorage.setItem('spotify_token', token);
    localStorage.setItem('spotify_token_time', Date.now());
    window.history.replaceState(null, null, window.location.pathname);
    return true;
  }
  const stored = localStorage.getItem('spotify_token');
  const storedTime = localStorage.getItem('spotify_token_time');
  if (stored && storedTime && Date.now() - storedTime < 3500000) {
    token = stored;
    return true;
  }
  return false;
}

function logout() {
  localStorage.removeItem('spotify_token');
  localStorage.removeItem('spotify_token_time');
  token = null;
  if (player) player.disconnect();
  document.getElementById('auth-screen').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
  clearInterval(progressInterval);
  clearInterval(vuInterval);
  clearInterval(waveInterval);
}

// ---- SPOTIFY API ----
async function api(endpoint, method = 'GET', body = null) {
  const opts = {
    method,
    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }
  };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(`https://api.spotify.com/v1${endpoint}`, opts);
  if (res.status === 204 || res.status === 202) return null;
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err?.error?.message || res.statusText);
  }
  return res.json().catch(() => null);
}

// ---- INIT ----
async function init() {
  try {
    const profile = await api('/me');
    document.getElementById('user-name').textContent = profile.display_name || profile.id;
    loadPlaylists();
    initSDK();
    pollPlayback();
    startProgressTimer();
    buildVU();
    animateWaveform();
  } catch (e) {
    console.error('Init error', e);
    logout();
  }
}

// ---- SDK ----
window.onSpotifyWebPlaybackSDKReady = () => {
  if (!token) return;
  player = new Spotify.Player({
    name: 'DECK DJ Controller',
    getOAuthToken: cb => cb(token),
    volume: 0.8
  });

  player.addListener('ready', ({ device_id }) => {
    deviceId = device_id;
    document.getElementById('device-val').textContent = 'DECK';
    transferPlayback(device_id);
  });

  player.addListener('player_state_changed', state => {
    if (!state) return;
    updateFromState(state);
  });

  player.connect();
};

function loadSDK() {
  const s = document.createElement('script');
  s.src = 'https://sdk.scdn.co/spotify-player.js';
  document.head.appendChild(s);
}

async function transferPlayback(id) {
  try {
    await api('/me/player', 'PUT', { device_ids: [id], play: false });
  } catch(e) {}
}

// ---- PLAYBACK STATE ----
function updateFromState(state) {
  if (!state) return;
  const track = state.track_window?.current_track;
  if (!track) return;
  currentTrack = track;
  isPlaying = !state.paused;
  currentPosition = state.position;
  currentDuration = state.duration;

  document.getElementById('track-name').textContent = track.name;
  document.getElementById('track-artist').textContent = track.artists?.map(a => a.name).join(', ') || '—';

  const img = track.album?.images?.[0]?.url;
  if (img) {
    document.getElementById('album-img').src = img;
    document.getElementById('album-img').style.display = 'block';
    document.getElementById('art-placeholder').style.display = 'none';
  } else {
    document.getElementById('album-img').style.display = 'none';
    document.getElementById('art-placeholder').style.display = 'flex';
  }

  document.getElementById('play-btn').textContent = isPlaying ? '⏸' : '▶';
  document.getElementById('vinyl-ring').className = 'vinyl-ring' + (isPlaying ? ' spinning' : '');

  const led = document.getElementById('status-led');
  const statusTxt = document.getElementById('status-text');
  led.className = 'status-led' + (isPlaying ? ' on' : '');
  statusTxt.textContent = isPlaying ? 'PLAYING' : 'PAUSED';

  updateProgress();
  highlightActiveTrack(track.id);
}

async function pollPlayback() {
  try {
    const state = await api('/me/player');
    if (state && state.item) {
      isPlaying = state.is_playing;
      currentPosition = state.progress_ms;
      currentDuration = state.item.duration_ms;
      updateFromState({
        track_window: { current_track: { ...state.item, album: state.item.album } },
        paused: !state.is_playing,
        position: state.progress_ms,
        duration: state.item.duration_ms
      });
      const dev = state.device?.name;
      if (dev) document.getElementById('device-val').textContent = dev.toUpperCase().substring(0, 8);
    }
  } catch(e) {}
  setTimeout(pollPlayback, 5000);
}

// ---- PROGRESS ----
function startProgressTimer() {
  progressInterval = setInterval(() => {
    if (isPlaying && currentDuration > 0) {
      currentPosition = Math.min(currentPosition + 500, currentDuration);
      updateProgress();
    }
  }, 500);
}

function updateProgress() {
  if (currentDuration <= 0) return;
  const pct = (currentPosition / currentDuration) * 100;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('pos-time').textContent = msToTime(currentPosition);
  document.getElementById('dur-time').textContent = msToTime(currentDuration);
  document.getElementById('prog-left').textContent = msToTime(currentPosition);
  document.getElementById('prog-right').textContent = msToTime(currentDuration);
}

function seekTrack(e) {
  if (!currentDuration) return;
  const wrap = document.getElementById('progress-wrap');
  const rect = wrap.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  const pos = Math.floor(pct * currentDuration);
  currentPosition = pos;
  if (player) {
    player.seek(pos);
  } else {
    api(`/me/player/seek?position_ms=${pos}`, 'PUT');
  }
  updateProgress();
}

// ---- CONTROLS ----
async function togglePlay() {
  if (player) {
    await player.togglePlay();
  } else {
    if (isPlaying) await api('/me/player/pause', 'PUT');
    else await api('/me/player/play', 'PUT');
  }
  isPlaying = !isPlaying;
  document.getElementById('play-btn').textContent = isPlaying ? '⏸' : '▶';
  document.getElementById('vinyl-ring').className = 'vinyl-ring' + (isPlaying ? ' spinning' : '');
  const led = document.getElementById('status-led');
  led.className = 'status-led' + (isPlaying ? ' on' : '');
  document.getElementById('status-text').textContent = isPlaying ? 'PLAYING' : 'PAUSED';
}

async function nextTrack() {
  if (player) await player.nextTrack();
  else await api('/me/player/next', 'POST');
}

async function prevTrack() {
  if (player) await player.previousTrack();
  else await api('/me/player/previous', 'POST');
}

async function toggleShuffle() {
  shuffleOn = !shuffleOn;
  await api(`/me/player/shuffle?state=${shuffleOn}`, 'PUT');
  document.getElementById('shuffle-btn').className = 'ctrl-btn' + (shuffleOn ? ' active' : '');
}

async function toggleRepeat() {
  const modes = ['off', 'track', 'context'];
  const idx = modes.indexOf(repeatMode);
  repeatMode = modes[(idx + 1) % modes.length];
  await api(`/me/player/repeat?state=${repeatMode}`, 'PUT');
  const btn = document.getElementById('repeat-btn');
  btn.className = 'ctrl-btn' + (repeatMode !== 'off' ? ' active' : '');
  btn.title = `Repeat: ${repeatMode}`;
}

async function setVolume(val) {
  document.getElementById('vol-val').textContent = val + '%';
  if (player) {
    await player.setVolume(val / 100);
  } else {
    await api(`/me/player/volume?volume_percent=${val}`, 'PUT');
  }
}

function setTempo(val) {
  const speed = (val / 100).toFixed(2);
  document.getElementById('tempo-val').textContent = speed + '×';
  // Visual only — Spotify API doesn't support playback speed
}

function crossfade(val) {
  // Visual crossfader — in a real 2-deck setup this would blend two sources
}

function updateEQ(band, val) {
  const db = Math.round((val - 50) / 50 * 12);
  document.getElementById(`eq-${band}`).textContent = (db >= 0 ? '+' : '') + db + ' dB';
  // Visual EQ — Web Audio API EQ would require capturing stream
}

// ---- PLAYLISTS ----
async function loadPlaylists() {
  try {
    const data = await api('/me/playlists?limit=50');
    const select = document.getElementById('playlist-select');
    if (data?.items) {
      data.items.forEach(pl => {
        const opt = document.createElement('option');
        opt.value = pl.id;
        opt.textContent = pl.name;
        select.appendChild(opt);
      });
    }
    // Load liked songs as well
    const opt2 = document.createElement('option');
    opt2.value = 'liked';
    opt2.textContent = '♥ Liked Songs';
    select.appendChild(opt2);
  } catch(e) {}
}

async function loadPlaylist(id) {
  if (!id) return;
  document.getElementById('track-list').innerHTML = '<div class="loading">LOADING TRACKS...</div>';
  try {
    let tracks = [];
    if (id === 'liked') {
      const data = await api('/me/tracks?limit=50');
      tracks = data.items.map(i => i.track).filter(Boolean);
    } else {
      const data = await api(`/playlists/${id}/tracks?limit=50`);
      tracks = data.items.map(i => i.track).filter(Boolean);
    }
    currentPlaylist = tracks;
    renderTrackList(tracks, id);
  } catch(e) {
    document.getElementById('track-list').innerHTML = `<div class="error-msg">Error loading tracks: ${e.message}</div>`;
  }
}

function renderTrackList(tracks, playlistId) {
  const list = document.getElementById('track-list');
  if (!tracks.length) { list.innerHTML = '<div class="loading">NO TRACKS FOUND</div>'; return; }
  list.innerHTML = '';
  tracks.forEach((track, i) => {
    const row = document.createElement('div');
    row.className = 'track-row';
    row.dataset.trackId = track.id;
    const art = track.album?.images?.[2]?.url || track.album?.images?.[0]?.url || '';
    row.innerHTML = `
      <div class="track-num">${i + 1}</div>
      <div class="track-thumb">${art ? `<img src="${art}" loading="lazy">` : '♪'}</div>
      <div class="track-row-info">
        <div class="track-row-name">${track.name}</div>
        <div class="track-row-artist">${track.artists?.map(a => a.name).join(', ') || '—'}</div>
      </div>
      <div class="track-row-dur">${msToTime(track.duration_ms)}</div>
    `;
    row.onclick = () => playTrack(track.uri, playlistId, i);
    list.appendChild(row);
  });
  highlightActiveTrack(currentTrack?.id);
}

async function playTrack(uri, playlistId, offset) {
  try {
    const body = playlistId && playlistId !== 'liked'
      ? { context_uri: `spotify:playlist:${playlistId}`, offset: { position: offset } }
      : { uris: [uri] };
    if (deviceId) body.device_id = deviceId;
    await api('/me/player/play', 'PUT', body);
    isPlaying = true;
    document.getElementById('play-btn').textContent = '⏸';
  } catch(e) {
    console.error('Play error', e);
  }
}

function highlightActiveTrack(id) {
  document.querySelectorAll('.track-row').forEach(row => {
    row.classList.toggle('active', row.dataset.trackId === id);
  });
}

// ---- VU METER ----
function buildVU() {
  const vu = document.getElementById('vu-meter');
  vu.innerHTML = '';
  vuBars = [];
  for (let i = 0; i < 32; i++) {
    const bar = document.createElement('div');
    bar.className = 'vu-bar';
    const fill = document.createElement('div');
    fill.className = 'vu-fill';
    bar.appendChild(fill);
    vu.appendChild(bar);
    vuBars.push(fill);
  }
  animateVU();
}

function animateVU() {
  let base = isPlaying ? 0.3 : 0.0;
  vuInterval = setInterval(() => {
    const target = isPlaying ? Math.random() * 0.7 + 0.2 : 0;
    vuBars.forEach((bar, i) => {
      const h = Math.max(0, target * Math.sin(i * 0.4 + Date.now() * 0.003) * 60 + target * 40);
      const pct = Math.min(100, Math.abs(h));
      bar.style.height = pct + '%';
      bar.className = 'vu-fill' + (pct > 80 ? ' hot' : '');
    });
  }, 80);
}

// ---- WAVEFORM ----
function animateWaveform() {
  const canvas = document.getElementById('waveform');
  const ctx = canvas.getContext('2d');
  let frame = 0;

  function draw() {
    canvas.width = canvas.offsetWidth;
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);

    const bars = Math.floor(W / 3);
    for (let i = 0; i < bars; i++) {
      const x = i * 3;
      const noise = Math.sin(i * 0.3 + frame * 0.05) * 0.5 +
                    Math.sin(i * 0.7 + frame * 0.03) * 0.3 +
                    Math.random() * (isPlaying ? 0.2 : 0.05);
      const h = isPlaying ? Math.abs(noise) * (H * 0.8) + 2 : Math.abs(noise) * 4 + 1;

      // Progress tint
      const progress = currentDuration > 0 ? currentPosition / currentDuration : 0;
      const isPast = (i / bars) < progress;

      ctx.fillStyle = isPast ? '#1DB954' : '#222';
      ctx.fillRect(x, (H - h) / 2, 2, h);
    }
    frame++;
    requestAnimationFrame(draw);
  }
  draw();
}

// ---- UTILS ----
function msToTime(ms) {
  const s = Math.floor(ms / 1000);
  const m = Math.floor(s / 60);
  return `${m}:${String(s % 60).padStart(2, '0')}`;
}

// ---- BOOT ----
if (getTokenFromHash()) {
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('app').style.flexDirection = 'column';
  loadSDK();
  init();
} else {
  document.getElementById('auth-screen').style.display = 'flex';
}
